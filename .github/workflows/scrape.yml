name: Weekly Gousto scrape

on:
  schedule:
    - cron: '0 7 * * WED'   # Every Wednesday at 07:00 UTC
  workflow_dispatch: {}     # Allow manual trigger from the Actions tab

permissions:
  contents: write           # Needed to commit new CSVs back to the repo

concurrency:
  group: gousto-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements-scraper.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push new CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: weekly scrape $(date -u +%Y-%m-%d)"
          # Retry push with rebase a few times in case another commit
          # (e.g. a manual code push) landed on main during the scrape.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected — rebasing and retrying (attempt $attempt/5)"
            git pull --rebase origin main
          done
          echo "Push failed after 5 attempts"
          exit 1
